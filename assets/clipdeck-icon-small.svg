<?xml version="1.0" encoding="UTF-8"?>
<!-- ClipDeck icon for small sizes (tray, taskbar, ico frames up to 64 px): the master (clipdeck-icon.svg) with the board 1.5x larger, since the dark tile vanishes on a dark taskbar. -->
<svg id="clipdeck-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ClipDeck">
  <defs>
    <!-- Night background -->
    <radialGradient id="cd-night" cx="0.5" cy="0.12" r="0.98">
      <stop offset="0" stop-color="#303038"/>
      <stop offset="0.55" stop-color="#141417"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>
    <!-- Aurora, top-left → bottom-right, the panel's --glow-colors -->
    <linearGradient id="cd-aurora" gradientUnits="userSpaceOnUse" x1="136" y1="98" x2="376" y2="402">
      <stop offset="0" stop-color="#8EF6FF"/>
      <stop offset="0.22" stop-color="#9FD0FF"/>
      <stop offset="0.45" stop-color="#CFA8FF"/>
      <stop offset="0.68" stop-color="#FF9FD2"/>
      <stop offset="0.86" stop-color="#FFB38A"/>
      <stop offset="1" stop-color="#F4FFA0"/>
    </linearGradient>
    <!-- White → grey button block -->
    <linearGradient id="cd-key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8BBC6"/>
    </linearGradient>
    <linearGradient id="cd-keyhi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="cd-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="cd-keyshadow" x="-30%" y="-60%" width="160%" height="260%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="cd-shape">
