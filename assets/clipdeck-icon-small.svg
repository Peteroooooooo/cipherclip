    </clipPath>
  </defs>

  <g clip-path="url(#cd-shape)">
    <rect width="512" height="512" fill="url(#cd-night)"/><g transform="translate(256 256) scale(1.5) translate(-256 -250)">

    <!-- Aurora glow under the frame -->
    <rect x="150" y="112" width="212" height="276" rx="46" fill="none" stroke="url(#cd-aurora)" stroke-width="28" opacity="0.85" filter="url(#cd-glow)"/>
    <!-- Board frame: aurora outline, black inside -->
    <rect x="150" y="112" width="212" height="276" rx="46" fill="#0E0E11" stroke="url(#cd-aurora)" stroke-width="28"/>

    <!-- White-grey button block in the upper half -->
    <g filter="url(#cd-keyshadow)">
      <rect x="186" y="150" width="140" height="58" rx="22" fill="url(#cd-key)"/>
    </g>
    <rect x="187.5" y="151.5" width="137" height="55" rx="20.5" fill="none" stroke="url(#cd-keyhi)" stroke-width="3"/>

    <!-- Content lines, same aurora -->
    <rect x="190" y="244" width="132" height="18" rx="9" fill="url(#cd-aurora)"/>
    <rect x="190" y="286" width="132" height="18" rx="9" fill="url(#cd-aurora)"/>
    <rect x="190" y="328" width="84" height="18" rx="9" fill="url(#cd-aurora)"/></g>
  </g>
